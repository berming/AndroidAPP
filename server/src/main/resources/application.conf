// Ktor / Netty 服务配置
//
// 实际监听地址：bind 127.0.0.1，外网通过 Caddy 反代到这里。
// 不开公网端口，符合 deploy/install.sh 关掉 8080 的纵深防御。
ktor {
    deployment {
        port = 8080
        host = "127.0.0.1"
    }
}

// admin 后台配置（PR 1 起会读取；PR 0 占位）
admin {
    // SQLite 路径。生产环境由 systemd unit 的 ReadWritePaths 控制可写权限。
    db {
        path = "/var/lib/communication-card/admin.db"
        path = ${?ADMIN_DB_PATH}
    }

    // session cookie：HttpOnly + Secure + SameSite=Lax
    cookieDomain = "bermin.cn"
    cookieDomain = ${?ADMIN_COOKIE_DOMAIN}
    cookieSecure = true
    cookieSecure = ${?ADMIN_COOKIE_SECURE}
    sessionTtlSeconds = 28800  // 8 hours，每次有效请求滚动续期

    // 首次启动检测到 admin_users 表为空时插入初始账号；从 env 读
    initial {
        username = "root"
        username = ${?ADMIN_INITIAL_USERNAME}
        password = ""
        password = ${?ADMIN_INITIAL_PASSWORD}
    }
}

name: Deploy to server

# 只在 push 到 main 后部署；PR 不触发，避免误覆盖生产
on:
  push:
    branches: [main]
    paths:
      # 只有这些文件变更才有意义重新部署
      - 'apps/web/**'
      - 'apps/admin/**'
      - 'shared/**'
      - 'server/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
  workflow_dispatch:  # 也允许手动触发

# 同时只跑一份，避免 rsync 互踩
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build + rsync to server
    runs-on: ubuntu-latest
    # opt-in：仅当 repo Variable DEPLOY_ENABLED 设为 'true' 时才跑。
    # 这样即使 PR 合并到 main 但 Secrets 还没配，也不会触发失败的 deploy。
    # 配好 Secrets 后在 Settings → Variables 加 DEPLOY_ENABLED=true 即可启用。
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # admin SPA 用 npm，缓存以 apps/admin/package-lock.json 为 key
          cache: 'npm'
          cache-dependency-path: apps/admin/package-lock.json

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build web dist + server installDist
        run: |
          ./gradlew :apps:web:wasmJsBrowserDistribution :server:installDist --no-daemon

      - name: Build admin SPA
        working-directory: apps/admin
        run: |
          npm ci
          npm run build

      - name: Verify build output
        run: |
          test -f apps/web/build/dist/wasmJs/productionExecutable/index.html
          test -f apps/admin/dist/index.html
          test -f server/build/install/server/bin/server
          ls -lh apps/web/build/dist/wasmJs/productionExecutable
          ls -lh apps/admin/dist
          ls -lh server/build/install/server/bin

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust server host key
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Verify directories are writable on server
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          # 目录必须预先由 install.sh（或手动）建好并 chown cards。
          # 如果缺失或权限错误，此步报错并打印修复命令，让运维手动修复后重跑。
          # 不在 CI 里 sudo chown（避免 sudoers 权限蔓延）。
          ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" '
            set -e
            ok=true
            # Web 静态目录
            for dir in /var/www/communication-card-web /var/www/communication-card-admin; do
              if [ ! -d "$dir" ] || [ ! -w "$dir" ]; then
                echo "ERROR: $dir 不存在或 $(whoami) 无写权限" >&2
                echo "  修复：sudo mkdir -p $dir && sudo chown cards:cards $dir" >&2
                ok=false
              fi
            done
            # Admin DB 数据目录：权限坏掉 → SQLITE_READONLY → 登录必然失败
            # 这是反复出现的问题根源，在此提前拦截，避免服务启动后才发现
            LIB_DIR=/var/lib/communication-card
            if [ ! -d "$LIB_DIR" ]; then
              echo "ERROR: $LIB_DIR 不存在" >&2
              echo "  修复：sudo mkdir -p $LIB_DIR && sudo chown cards:cards $LIB_DIR" >&2
              ok=false
            elif [ ! -w "$LIB_DIR" ]; then
              echo "ERROR: $LIB_DIR 存在但 $(whoami) 无写权限（admin DB 将 SQLITE_READONLY）" >&2
              echo "  修复：sudo chown -R cards:cards $LIB_DIR" >&2
              ok=false
            else
              echo "OK: $LIB_DIR 可写（admin DB 权限正常）"
            fi
            # Also check the DB file itself: the directory may be writable but an existing
            # admin.db owned by root still causes SQLITE_READONLY on every write.
            DB_FILE="$LIB_DIR/admin.db"
            if [ -f "$DB_FILE" ] && [ ! -w "$DB_FILE" ]; then
              echo "ERROR: $DB_FILE 存在但 $(whoami) 无写权限（SQLITE_READONLY）" >&2
              echo "  修复：sudo chown cards:cards $DB_FILE" >&2
              ok=false
            else
              echo "OK: $DB_FILE 权限正常（不存在或可写）"
            fi
            $ok
          '

      - name: Rsync web static dist
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          rsync -avz --delete \
            apps/web/build/dist/wasmJs/productionExecutable/ \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:/var/www/communication-card-web/"

      - name: Rsync admin SPA dist
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          rsync -avz --delete \
            apps/admin/dist/ \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:/var/www/communication-card-admin/"

      - name: Rsync server installDist
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          rsync -avz --delete \
            server/build/install/server/ \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:/opt/communication-card/server/"

      - name: Restart server + reload Caddy
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" '
            set -e
            # 必须与 install.sh 写入 sudoers 的路径一致 —— 都用 command -v 解析。
            # Ubuntu 22.04 是 /usr/bin/systemctl（/bin 是 usrmerge symlink，
            # sudo 字符串匹配命令路径，写错了 NOPASSWD 失效）。
            SYSCTL=$(command -v systemctl)
            # daemon-reload 让 systemd 从磁盘重读 unit 文件（ProtectSystem 等变更才生效）
            sudo "$SYSCTL" daemon-reload
            sudo "$SYSCTL" restart communication-card-server
            sudo "$SYSCTL" reload caddy
            sudo "$SYSCTL" status communication-card-server --no-pager | head -20
          '

      - name: Health check (Ktor /health)
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -e
          # 直接 SSH 到服务器 curl localhost:8080/health，绕过 Caddy 静态文件兜底。
          # 以前的 http://<IP>/ 测的是 Caddy 301 redirect，Ktor 挂掉也会通过。
          for i in $(seq 1 15); do
            if ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" 'curl -fsS --max-time 3 http://127.0.0.1:8080/health' 2>/dev/null; then
              echo "✅ http://127.0.0.1:8080/health 返回 200"
              exit 0
            fi
            echo "等服务起来 ... ($i/15)"
            sleep 2
          done
          echo "❌ Ktor 健康检查超时（服务可能未能启动）"
          echo "🔍 诊断（最后一次尝试，保留 curl/SSH 错误输出）："
          ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" 'curl -v --max-time 3 http://127.0.0.1:8080/health || true'
          exit 1

name: Deploy to server

# 只在 push 到 main 后部署；PR 不触发，避免误覆盖生产
on:
  push:
    branches: [main]
    paths:
      # 只有这些文件变更才有意义重新部署
      - 'apps/web/**'
      - 'shared/**'
      - 'server/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
  workflow_dispatch:  # 也允许手动触发

# 同时只跑一份，避免 rsync 互踩
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build + rsync to server
    runs-on: ubuntu-latest
    # opt-in：仅当 repo Variable DEPLOY_ENABLED 设为 'true' 时才跑。
    # 这样即使 PR 合并到 main 但 Secrets 还没配，也不会触发失败的 deploy。
    # 配好 Secrets 后在 Settings → Variables 加 DEPLOY_ENABLED=true 即可启用。
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build web dist + server installDist
        run: |
          ./gradlew :apps:web:wasmJsBrowserDistribution :server:installDist --no-daemon

      - name: Verify build output
        run: |
          test -f apps/web/build/dist/wasmJs/productionExecutable/index.html
          test -f server/build/install/server/bin/server
          ls -lh apps/web/build/dist/wasmJs/productionExecutable
          ls -lh server/build/install/server/bin

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust server host key
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Rsync web static dist
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          rsync -avz --delete \
            apps/web/build/dist/wasmJs/productionExecutable/ \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:/var/www/communication-card-web/"

      - name: Rsync server installDist
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          rsync -avz --delete \
            server/build/install/server/ \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:/opt/communication-card/server/"

      - name: Restart server + reload Caddy
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" '
            set -e
            sudo /bin/systemctl restart communication-card-server
            sudo /bin/systemctl reload caddy
            sudo /bin/systemctl status communication-card-server --no-pager | head -20
          '

      - name: Health check
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          set -e
          # 等服务起来；最长 30s
          for i in $(seq 1 15); do
            if curl -fsS --max-time 3 "http://$DEPLOY_SSH_HOST/" >/dev/null; then
              echo "✅ http://$DEPLOY_SSH_HOST/ 返回 200"
              exit 0
            fi
            echo "等服务起来 ... ($i/15)"
            sleep 2
          done
          echo "❌ 健康检查超时"
          exit 1

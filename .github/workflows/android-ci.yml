name: Android Build CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 失败时把 gradle 日志贴回 PR 作为评论（沙箱通过 MCP 读取），需要 write 权限
permissions:
  contents: read
  pull-requests: write

jobs:
  # ============================================================
  # 关键路径 TDD 守门：PR 改了 CardRules.kt / SettlementCalculator.kt /
  # ServerGameManager.kt 这些文件，但没改对应 *Test.kt → 直接红
  # （CLAUDE.md 第三章 + docs/playbooks/bug-triage.md）
  #
  # 路径已对齐 :shared KMP 重构后的新位置（CardRules / SettlementCalculator
  # 在 shared/src/commonMain；测试在 shared/src/commonTest）。
  # ============================================================
  tdd-gate:
    name: TDD gate (critical paths require tests)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout (with full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify critical-path changes are accompanied by tests
        run: |
          set -u
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          HEAD_REF="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$BASE_REF" "$HEAD_REF")
          echo "Changed files in this PR:"
          echo "$changed"
          echo "---"

          fail=0
          # 关键路径 → 对应测试。:shared 抽离后，CardRules / SettlementCalculator
          # 的 main + test 都在 :shared；ServerGameManager 仍在 server/。
          declare -A REQUIRES=(
            ["shared/src/commonMain/kotlin/com/communicationcard/game/engine/CardRules.kt"]="shared/src/commonTest/kotlin/com/communicationcard/game/engine/CardRulesTest.kt"
            ["shared/src/commonMain/kotlin/com/communicationcard/game/engine/SettlementCalculator.kt"]="shared/src/commonTest/kotlin/com/communicationcard/game/engine/SettlementCalculatorTest.kt"
            ["server/src/main/kotlin/com/communicationcard/server/ServerGameManager.kt"]="server/src/test/kotlin/com/communicationcard/server/ServerGameManagerTest.kt"
          )

          for src in "${!REQUIRES[@]}"; do
            test_path="${REQUIRES[$src]}"
            if echo "$changed" | grep -qx "$src"; then
              if ! echo "$changed" | grep -qx "$test_path"; then
                echo "❌ $src 改动了，但 $test_path 没动。"
                echo "   关键路径必须先 TDD（CLAUDE.md 第三章）。"
                fail=1
              else
                echo "✅ $src 与 $test_path 同改"
              fi
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "提示：先在对应 *Test.kt 写失败测试 commit，再实施修复 commit。"
            echo "      详见 docs/playbooks/bug-triage.md（Loop B）。"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 共享模块测试（含 SettlementCalculatorTest 15 用例 + CardRulesTest）
      - name: Run shared module tests (commonTest)
        run: |
          set -o pipefail
          ./gradlew :shared:jvmTest --info --stacktrace 2>&1 \
            | tee sharedJvmTest.log

      - name: Surface :shared:jvmTest error on failure
        if: failure() && hashFiles('sharedJvmTest.log') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## ❌ :shared:jvmTest 失败"
            echo ""
            echo "<details><summary>关键错误片段（grep）— 点击展开</summary>"
            echo ""
            echo '```'
            grep -nE "^e: |^w: |^error:|FAILURE:|^> Task .* FAILED|What went wrong|Could not resolve|^Caused by:" sharedJvmTest.log \
              | head -80 || echo "(no Kotlin error lines found)"
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>末 300 行 gradle 输出 — 点击展开</summary>"
            echo ""
            echo '```'
            tail -300 sharedJvmTest.log
            echo '```'
            echo "</details>"
          } | tee -a "$GITHUB_STEP_SUMMARY" > comment-sharedJvmTest.md
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file comment-sharedJvmTest.md \
              || echo "PR comment failed; summary still written"
          fi

      # 服务端单元测试（含 ServerGameManagerTest）
      # PR-H3 起 server 是 :server 子项目，不再需要 working-directory。
      - name: Run server unit tests
        run: |
          set -o pipefail
          ./gradlew :server:test --info --stacktrace 2>&1 \
            | tee serverTest.log

      - name: Surface :server:test error on failure
        if: failure() && hashFiles('serverTest.log') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## ❌ :server:test 失败"
            echo ""
            echo "<details><summary>关键错误片段（grep）— 点击展开</summary>"
            echo ""
            echo '```'
            grep -nE "^e: |^w: |^error:|FAILURE:|^> Task .* FAILED|What went wrong|Could not resolve|^Caused by:" serverTest.log \
              | head -80 || echo "(no Kotlin error lines found)"
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>末 300 行 gradle 输出 — 点击展开</summary>"
            echo ""
            echo '```'
            tail -300 serverTest.log
            echo '```'
            echo "</details>"
          } | tee -a "$GITHUB_STEP_SUMMARY" > comment-serverTest.md
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file comment-serverTest.md \
              || echo "PR comment failed; summary still written"
          fi

      # Detekt 静态扫描；目前用 continue-on-error 软失败（待生成 baseline 后改回硬关）
      - name: Detekt static analysis
        run: ./gradlew detekt
        continue-on-error: true

      - name: Build Debug APK with Gradle
        # 加 --info --stacktrace + tee 到日志文件；失败时下一步把 grep+tail 写到
        # GITHUB_STEP_SUMMARY 与 PR 评论，方便沙箱/无登录环境通过 MCP 读取错误。
        run: |
          set -o pipefail
          ./gradlew :apps:android:assembleDebug --info --stacktrace 2>&1 \
            | tee assembleDebug.log

      - name: Surface assembleDebug error on failure
        if: failure() && hashFiles('assembleDebug.log') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 评论体：标题永远显示，详细 grep + tail 默认折叠（<details>）
          # —— 大部分时候只想看错误摘要，需要时再点开看详情。
          {
            echo "## ❌ :apps:android:assembleDebug 失败"
            echo ""
            echo "<details><summary>关键错误片段（grep）— 点击展开</summary>"
            echo ""
            echo '```'
            grep -nE "^e: |^w: |^error:|FAILURE:|^> Task .* FAILED" assembleDebug.log \
              | head -80 \
              || echo "(no Kotlin error lines found)"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>末 300 行 gradle 输出 — 点击展开</summary>"
            echo ""
            echo '```'
            tail -300 assembleDebug.log
            echo '```'
            echo ""
            echo "</details>"
          } | tee -a "$GITHUB_STEP_SUMMARY" > comment-assembleDebug.md
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file comment-assembleDebug.md \
              || echo "PR comment failed; summary still written"
          fi

      - name: Build Web (Wasm-JS) bundle
        run: |
          set -o pipefail
          ./gradlew :apps:web:wasmJsBrowserDistribution --info --stacktrace 2>&1 \
            | tee wasmJsBrowserDistribution.log

      - name: Surface wasmJsBrowserDistribution error on failure
        if: failure() && hashFiles('wasmJsBrowserDistribution.log') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 评论体：标题永远显示，3 个详情段都默认折叠（<details>）。
          # 用户大部分情况只看错误摘要；需要时再展开看头/末/grep 片段。
          {
            echo "## ❌ :apps:web:wasmJsBrowserDistribution 失败"
            echo ""
            echo "<details><summary>关键错误片段（grep）— 点击展开</summary>"
            echo ""
            echo '```'
            grep -nE "^e: |^w: |^error:|FAILURE:|^> Task .* FAILED|What went wrong|Could not resolve|Could not find|Cannot find|not found|Plugin .* was not found|^Caused by:" wasmJsBrowserDistribution.log \
              | head -100 \
              || echo "(no error markers found)"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>头 100 行（gradle config 阶段错误通常在这里）— 点击展开</summary>"
            echo ""
            echo '```'
            head -100 wasmJsBrowserDistribution.log
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>末 200 行 — 点击展开</summary>"
            echo ""
            echo '```'
            tail -200 wasmJsBrowserDistribution.log
            echo '```'
            echo ""
            echo "</details>"
          } | tee -a "$GITHUB_STEP_SUMMARY" > comment-wasmJs.md
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file comment-wasmJs.md \
              || echo "PR comment failed; summary still written"
          fi

      - name: Upload Web bundle
        uses: actions/upload-artifact@v4
        with:
          name: communication-card-web
          path: apps/web/build/dist/wasmJs/productionExecutable
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Communication Card APK
        uses: actions/upload-artifact@v4
        with:
          name: communication-card-app
          path: apps/android/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test + detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            apps/android/build/reports/
            apps/android/build/test-results/
            shared/build/reports/
            shared/build/test-results/
            server/build/reports/
            server/build/test-results/
            build/reports/detekt/
          if-no-files-found: warn
          retention-days: 7

  # ============================================================
  # admin SPA 构建 + 产物大小 sanity check（PR 4 引入）。
  # 与 :apps:android / :apps:web 解耦：用 Node 20 + npm 而不是 Gradle。
  # ============================================================
  admin-build:
    name: Build admin SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install + build
        working-directory: apps/admin
        run: |
          npm ci
          npm run build

      - name: Verify build output
        run: |
          test -f apps/admin/dist/index.html
          ls -lh apps/admin/dist
          # 防 Element Plus 全量打包回归：dist 总大小 > 5 MB 视为异常
          size_bytes=$(du -sb apps/admin/dist | cut -f1)
          echo "dist size: $size_bytes bytes ($(du -sh apps/admin/dist | cut -f1))"
          if [ "$size_bytes" -gt $((5 * 1024 * 1024)) ]; then
            echo "❌ apps/admin/dist 超过 5 MB —— 检查 Element Plus 是否退化成全量加载"
            exit 1
          fi

      - name: Upload admin dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: communication-card-admin
          path: apps/admin/dist
          if-no-files-found: warn
          retention-days: 7

  # ============================================================
  # 同步 PR 描述里"CI 绿"那一行的勾选状态。
  #
  # 只动这一格 —— 其他三关（Codex / Claude /review / 真机）按设计仍是
  # 人工勾，CI 不替它们打钩，避免把 4 关流程退化成单点守门。
  #
  # 触发：tdd-gate + build + admin-build 都跑完即触发（success 或 failure 都来）。
  # 写入：success → `- [x] **CI 绿**`；其他 → `- [ ] **CI 绿**`（回滚）。
  # 幂等：内容已是目标态时不写。
  # ============================================================
  update-ci-checkbox:
    name: Sync PR description "CI 绿" checkbox
    runs-on: ubuntu-latest
    needs: [tdd-gate, build, admin-build]
    # `always()` 让 needs 失败/跳过时也能执行（用来把勾恢复回未选）；
    # 仅 PR 事件需要更新描述（push 到 main 时没 PR 可改）。
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Update CI checkbox in PR body
        uses: actions/github-script@v7
        env:
          TDD_GATE_RESULT: ${{ needs.tdd-gate.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          ADMIN_BUILD_RESULT: ${{ needs.admin-build.result }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const UNTICKED = '- [ ] **CI 绿**';
            const TICKED = '- [x] **CI 绿**';
            const allGreen =
              process.env.TDD_GATE_RESULT === 'success' &&
              process.env.BUILD_RESULT === 'success' &&
              process.env.ADMIN_BUILD_RESULT === 'success';
            const target = allGreen ? TICKED : UNTICKED;
            const other  = allGreen ? UNTICKED : TICKED;
            if (!body.includes(other) && !body.includes(target)) {
              core.info('CI checkbox marker not found in PR body; nothing to do.');
              return;
            }
            if (body.includes(target) && !body.includes(other)) {
              core.info(`Already in target state (${allGreen ? 'ticked' : 'unticked'}); idempotent skip.`);
              return;
            }
            const newBody = body.replace(other, target);
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: newBody,
            });
            core.info(`PR #${pr.number} body updated → ${allGreen ? 'CI 绿 ticked' : 'CI 绿 unticked (rollback)'}`);

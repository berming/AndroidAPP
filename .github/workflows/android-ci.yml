name: Android Build CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 失败时把 gradle 日志贴回 PR 作为评论（沙箱通过 MCP 读取），需要 write 权限
permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew server/gradlew

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run shared module tests (commonTest)
        run: ./gradlew :shared:jvmTest

      - name: Run server unit tests
        working-directory: server
        run: ./gradlew test

      - name: Detekt static analysis
        run: ./gradlew detekt
        # 在沙箱环境无法运行 detektBaseline 任务，先以非阻塞模式运行；
        # 报告仍会上传到 reports artifact 供 review。
        # 待生成 detekt-baseline.xml 后改回 continue-on-error: false。
        continue-on-error: true

      - name: Build Debug APK with Gradle
        # 加 --info --stacktrace + tee 到日志文件；失败时下一步把尾巴 200 行
        # 写到 GITHUB_STEP_SUMMARY，方便沙箱/无登录环境通过 WebFetch 看到错误。
        run: |
          set -o pipefail
          ./gradlew :apps:communication-card:assembleDebug --info --stacktrace 2>&1 \
            | tee assembleDebug.log

      - name: Surface assembleDebug error on failure
        if: failure() && hashFiles('assembleDebug.log') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 双段输出：(1) 抓到的 Kotlin compiler "e:" 行（最关键）
          # (2) 末 300 行 gradle 输出（兜底）
          {
            echo "## :apps:communication-card:assembleDebug 失败"
            echo ""
            echo "### Kotlin compiler errors（grep 'e:' / 'error:'）"
            echo ""
            echo '```'
            grep -nE "^e: |^w: |^error:|FAILURE:|^> Task .* FAILED" assembleDebug.log \
              | head -80 \
              || echo "(no Kotlin error lines found)"
            echo '```'
            echo ""
            echo "### 末 300 行 gradle 输出"
            echo ""
            echo '```'
            tail -300 assembleDebug.log
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" > comment-assembleDebug.md
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file comment-assembleDebug.md \
              || echo "PR comment failed; summary still written"
          fi

      - name: Build Web (Wasm-JS) bundle
        run: |
          set -o pipefail
          ./gradlew :apps:web:wasmJsBrowserDistribution --info --stacktrace 2>&1 \
            | tee wasmJsBrowserDistribution.log

      - name: Surface wasmJsBrowserDistribution error on failure
        if: failure() && hashFiles('wasmJsBrowserDistribution.log') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## :apps:web:wasmJsBrowserDistribution 失败"
            echo ""
            echo "### 关键错误片段（grep）"
            echo ""
            echo '```'
            grep -nE "^e: |^w: |^error:|FAILURE:|^> Task .* FAILED|What went wrong|Could not resolve|Could not find|Cannot find|not found|Plugin .* was not found|^Caused by:" wasmJsBrowserDistribution.log \
              | head -100 \
              || echo "(no error markers found)"
            echo '```'
            echo ""
            echo "### 头 100 行（gradle config 阶段错误通常在这里）"
            echo ""
            echo '```'
            head -100 wasmJsBrowserDistribution.log
            echo '```'
            echo ""
            echo "### 末 200 行"
            echo ""
            echo '```'
            tail -200 wasmJsBrowserDistribution.log
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" > comment-wasmJs.md
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file comment-wasmJs.md \
              || echo "PR comment failed; summary still written"
          fi

      - name: Upload Web bundle
        uses: actions/upload-artifact@v4
        with:
          name: communication-card-web
          path: apps/web/build/dist/wasmJs/productionExecutable
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Communication Card APK
        uses: actions/upload-artifact@v4
        with:
          name: communication-card-app
          path: apps/communication-card/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test + detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            apps/communication-card/build/reports/
            apps/communication-card/build/test-results/
            server/build/reports/
            server/build/test-results/
            build/reports/detekt/
          if-no-files-found: warn
          retention-days: 7

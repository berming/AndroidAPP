name: Android Build CI

# 触发条件：当代码推送到main分支，或针对main分支发起pull_request时触发
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 定义工作流中的任务
jobs:
  build:
    # 在GitHub托管的Linux最新版虚拟环境中运行
    runs-on: ubuntu-latest

    # 定义步骤
    steps:
      # 1. 拉取代码到虚拟环境
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 设置Java环境（Android开发需要JDK 11或17）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 设置Gradle包装器（wrapper）可执行权限（Linux环境需要）
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 【关键优化】设置Gradle依赖缓存，大幅加快后续构建速度
      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. 构建Debug版本APK
      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug

      # 6. 上传所有模块的Debug APK
      - name: Upload All Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: all-debug-apks
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/**/debug/*.apk
          if-no-files-found: warn  # 如果没有找到文件则警告而不是失败
          retention-days: 7

      # 7. （可选）上传特定模块的APK
      - name: Upload Specific Module APKs
        uses: actions/upload-artifact@v4
        with:
          name: gomoku-app
          path: apps/gomoku/build/outputs/apk/debug/*.apk

      - name: Upload Communication Card APKs
        uses: actions/upload-artifact@v4
        with:
          name: communication-card-app
          path: apps/communication-card/build/outputs/apk/debug/*.apk
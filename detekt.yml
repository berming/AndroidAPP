build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

processors:
  active: true

console-reports:
  active: true
  exclude:
    - 'ProjectStatisticsReport'
    - 'ComplexityReport'
    - 'NotificationReport'
    - 'FindingsReport'
    - 'FileBasedFindingsReport'

# 启用本项目重点关注的规则集
potential-bugs:
  active: true
  AvoidReferentialEquality:
    active: true
  CastToNullableType:
    active: true
  Deprecation:
    active: false  # 部分 Android API 已废弃但仍在使用
  DontDowncastCollectionTypes:
    active: true
  DoubleMutabilityForCollection:
    active: true
  ElseCaseInsteadOfExhaustiveWhen:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  EqualsWithHashCodeExist:
    active: true
  ExitOutsideMain:
    active: true
  ExplicitGarbageCollectionCall:
    active: true
  HasPlatformType:
    active: false  # Android Java 互操作时大量出现，与 IDE 警告重复
  IgnoredReturnValue:
    active: false  # WebSocket.send() 等返回值常忽略
  ImplicitDefaultLocale:
    active: false  # 项目主用中文显示
  IteratorHasNextCallsNextMethod:
    active: true
  IteratorNotThrowingNoSuchElementException:
    active: true
  LateinitUsage:
    active: false  # Android UI 大量使用 lateinit，不一刀切
  MapGetWithNotNullAssertionOperator:
    active: true
  MissingPackageDeclaration:
    active: false
  NullCheckOnMutableProperty:
    active: true
  NullableToStringCall:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true
  UnnecessaryNotNullOperator:
    active: true
  UnnecessarySafeCall:
    active: true
  UnreachableCatchBlock:
    active: true
  UnreachableCode:
    active: true
  UnsafeCallOnNullableType:
    active: true
  UnsafeCast:
    active: false  # Android getSystemService 等惯用强转
  UselessPostfixExpression:
    active: true
  WrongEqualsTypeParameter:
    active: true

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    active: false  # 项目暂未使用 DI 框架，直接使用 Dispatchers
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true
  SuspendFunWithCoroutineScopeReceiver:
    active: true
  SuspendFunWithFlowReturnType:
    active: true

empty-blocks:
  active: true
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected).*'  # 允许 catch (_: Exception) {} 显式忽略
  EmptyClassBlock:
    active: true
  EmptyDefaultConstructor:
    active: true
  EmptyDoWhileBlock:
    active: true
  EmptyElseBlock:
    active: true
  EmptyFinallyBlock:
    active: true
  EmptyForBlock:
    active: true
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true
  EmptyIfBlock:
    active: true
  EmptyInitBlock:
    active: true
  EmptyKtFile:
    active: true
  EmptySecondaryConstructor:
    active: true
  EmptyTryBlock:
    active: true
  EmptyWhenBlock:
    active: true

exceptions:
  active: true
  NotImplementedDeclaration:
    active: true
  PrintStackTrace:
    active: false  # 服务端调试日志保留
  RethrowCaughtException:
    active: true
  ReturnFromFinally:
    active: true
  SwallowedException:
    active: true
  ThrowingExceptionFromFinally:
    active: true
  ThrowingExceptionInMain:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
  ThrowingNewInstanceOfSameException:
    active: true
  TooGenericExceptionCaught:
    active: false  # 服务端故意 catch 大异常保护 WebSocket
  TooGenericExceptionThrown:
    active: true

# 风格规则不强制
style:
  active: true
  MagicNumber:
    active: false  # 卡牌游戏大量使用具体数字
  WildcardImport:
    active: false  # 现有代码大量使用通配符导入，逐步迁移
  MaxLineLength:
    active: false  # 中文注释经常超长
  ReturnCount:
    active: false
  ForbiddenComment:
    active: false  # 允许 TODO/FIXME 备注
  UnusedPrivateMember:
    active: false  # AI 决策代码常有备用分支
  UnusedParameter:
    active: false  # Listener 接口常有未用参数

# 复杂度规则
complexity:
  active: true
  ComplexCondition:
    active: true
    threshold: 6  # 牌型/AI 决策中复合条件较多
  ComplexInterface:
    active: false
  CyclomaticComplexMethod:
    active: true
    threshold: 25  # UI 状态机 + 游戏阶段切换稍放宽
  LargeClass:
    active: true
    threshold: 1500  # 现有 UI Activity 较大（GameActivity 1473 行），先以高阈值兜底
    excludes:
      # Android Activities 因生命周期/视图绑定天然较大，单独豁免
      - '**/ui/GameActivity.kt'
      - '**/ui/multiplayer/OnlineGameActivity.kt'
      - '**/server/ServerGameManager.kt'
  LongMethod:
    active: true
    threshold: 120  # UI 渲染方法常较长（动画 + 视图绑定）
  LongParameterList:
    active: false  # 数据类构造常长
  NestedBlockDepth:
    active: true
    threshold: 6
  TooManyFunctions:
    active: false

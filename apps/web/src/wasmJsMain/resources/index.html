<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>沟通牌 · 浏览器版</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1b5e20;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: hidden;
        }
        #composeTarget {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        #loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
            transition: opacity 200ms ease-out;
        }
        #loader.hidden {
            opacity: 0;
        }
        .loader-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="composeTarget"></div>
    <div id="loader">
        <div class="loader-spinner"></div>
        <div>正在加载沟通牌 Web 客户端…</div>
    </div>
    <script type="application/javascript" src="communicationCardWeb.js"></script>
</body>
</html>
